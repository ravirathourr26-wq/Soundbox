name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Soundbox.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: Soundbox
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Soundbox" --notes "Latest APK"
          cp Soundbox/app/build/outputs/apk/debug/app-debug.apk Soundbox.apk
          gh release upload latest Soundbox.apk --clobber
